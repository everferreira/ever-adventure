<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Ever's World — Conheça a Ever!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .game-wrap {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(130, 87, 229, 0.25);
        }
        canvas {
            display: block;
            border-radius: 12px;
            background: linear-gradient(180deg, #5c94fc 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
            width: 720px;
            height: 400px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            color: #ccc;
            font-size: 14px;
        }
        .hud .val { color: #FFD700; font-weight: bold; }
        .controls {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 8px 0 2px;
        }
        .controls kbd {
            background: rgba(130,87,229,0.15);
            color: #8257E5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid rgba(130,87,229,0.3);
        }
        .btn {
            background: #FFD700;
            color: #1a1a2e;
            border: none;
            padding: 6px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #ffed4a; }
        .msg-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #FFD700;
            pointer-events: none;
            transition: opacity 0.3s;
            display: none;
            max-width: 500px;
        }
        .msg-box.show { display: block; }
        canvas { cursor: pointer; }
    </style>
</head>
<body>
<div style="position:relative">
    <div class="game-wrap">
        <div class="hud">
            <span>⭐ <span class="val" id="starCount">0</span>/7</span>
            <button class="btn" id="resetBtn">↻ Jogar de novo</button>
        </div>
        <canvas id="game" width="720" height="400"></canvas>
        <div class="controls">
            <kbd>←</kbd> <kbd>→</kbd> andar · <kbd>Space</kbd> pular · <kbd>R</kbd> reiniciar
        </div>
    </div>
    <div class="msg-box" id="msgBox"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const starSpan = document.getElementById('starCount');
const msgBox = document.getElementById('msgBox');

// ─── ESTRELAS ──────────────────────────────────────────────
const STARS = [
    { x: 180, y: 300, msg: '✨ Ever Maria Tobias Ferreira' },
    { x: 320, y: 200, msg: '👩‍🏫 Instrutora Sênior na Ctrl+Play' },
    { x: 420, y: 120, msg: '🤖 Especialista em IA & Cloud (AWS/Azure)' },
    { x: 200, y: 120, msg: '🐍 Python · C/C++ · APIs (Flask/FastAPI)' },
    { x: 520, y: 240, msg: '🐧 Linux · Docker · Git · IaC' },
    { x: 380, y: 300, msg: '🎮 Arduino · Scratch · Construct · Unity' },
    { x: 600, y: 150, msg: '📧 contatoeverferreira@gmail.com' },
];
let collected = new Array(STARS.length).fill(false);
let starsCollected = 0;

// ─── JOGADOR (Mario style) ─────────────────────────────────
const player = {
    x: 60, y: 280, w: 28, h: 34,
    vx: 0, vy: 0,
    speed: 3.5,
    jumpPower: -7.5,
    gravity: 0.4,
    grounded: false,
    onGround: false,
    dir: 1,
};

// ─── PLATAFORMAS ───────────────────────────────────────────
const platforms = [
    // Chão
    { x: 0, y: 365, w: 720, h: 35 },
    // Plataformas
    { x: 140, y: 300, w: 100, h: 14 },
    { x: 300, y: 240, w: 90, h: 14 },
    { x: 430, y: 180, w: 100, h: 14 },
    { x: 250, y: 140, w: 70, h: 14 },
    { x: 570, y: 270, w: 90, h: 14 },
    { x: 80, y: 180, w: 70, h: 14 },
];

// ─── ENTRADA ───────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyR') resetGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
document.getElementById('resetBtn').addEventListener('click', resetGame);
canvas.addEventListener('click', () => {
    if (starsCollected === STARS.length) resetGame();
});

// ─── FUNÇÕES ───────────────────────────────────────────────
function resetGame() {
    player.x = 60; player.y = 280;
    player.vx = 0; player.vy = 0;
    player.grounded = false;
    collected = new Array(STARS.length).fill(false);
    starsCollected = 0;
    starSpan.textContent = '0';
    msgBox.classList.remove('show');
}

function showMsg(text) {
    msgBox.textContent = text;
    msgBox.classList.add('show');
    setTimeout(() => msgBox.classList.remove('show'), 2200);
}

// ─── UPDATE ────────────────────────────────────────────────
function update() {
    // Input
    player.vx = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -player.speed; player.dir = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { player.vx = player.speed; player.dir = 1; }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    player.vy += player.gravity;
    if (player.vy > 10) player.vy = 10;

    // X
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > 720) player.x = 720 - player.w;

    // Y
    player.y += player.vy;

    // Colisão com plataformas
    player.grounded = false;
    for (const p of platforms) {
        const px = player.x, py = player.y, pw = player.w, ph = player.h;
        if (px + pw > p.x && px < p.x + p.w && py + ph > p.y && py < p.y + p.h) {
            // De cima
            if (player.vy > 0 && py + ph - player.vy <= p.y + 6) {
                player.y = p.y - ph; player.vy = 0; player.grounded = true;
            }
            // De baixo
            else if (player.vy < 0 && py - player.vy >= p.y + p.h - 6) {
                player.y = p.y + p.h; player.vy = 0;
            }
            // Lados
            else if (player.vx > 0 && px + pw - player.vx <= p.x + 6) {
                player.x = p.x - pw;
            } else if (player.vx < 0 && px - player.vx >= p.x + p.w - 6) {
                player.x = p.x + p.w;
            }
        }
    }

    // Se cair, volta
    if (player.y > 420) { player.x = 60; player.y = 280; player.vy = 0; }

    // Coletar estrelas
    for (let i = 0; i < STARS.length; i++) {
        if (collected[i]) continue;
        const s = STARS[i];
        const dx = (player.x + player.w/2) - s.x;
        const dy = (player.y + player.h/2) - s.y;
        if (Math.sqrt(dx*dx + dy*dy) < 22) {
            collected[i] = true;
            starsCollected++;
            starSpan.textContent = starsCollected;
            showMsg(s.msg);
        }
    }

    // Fim de jogo
    if (starsCollected === STARS.length) {
        // Só mostra se não tiver mostrado ainda
        if (msgBox.textContent !== '🎉 Você conheceu a Ever! <br> Clique para jogar de novo') {
            setTimeout(() => {
                msgBox.innerHTML = '🎉 Você conheceu a Ever!<br><span style="font-size:14px;color:#aaa">Clique para jogar de novo</span>';
                msgBox.classList.add('show');
            }, 2400);
        }
    }
}

// ─── DRAW ──────────────────────────────────────────────────
function draw() {
    ctx.clearRect(0, 0, 720, 400);

    // ─── Céu ───────────────────────────────────────────────
    const grad = ctx.createLinearGradient(0, 0, 0, 400);
    grad.addColorStop(0, '#5c94fc');
    grad.addColorStop(0.55, '#87CEEB');
    grad.addColorStop(0.56, '#90EE90');
    grad.addColorStop(1, '#228B22');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 720, 400);

    // Nuvens
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 5; i++) {
        const cx = (i * 170 + 20) % 720;
        const cy = 30 + (i % 3) * 25;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 35, 15, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx+25, cy-5, 25, 12, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx-20, cy-3, 20, 10, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // ─── Plataformas (estilo Mario) ────────────────────────
    for (const p of platforms) {
        // Brick pattern
        ctx.fillStyle = '#C4722C';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#8B5E3C';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        // Linhas de tijolo
        ctx.strokeStyle = '#8B5E3C';
        ctx.lineWidth = 1;
        for (let bx = p.x + 15; bx < p.x + p.w; bx += 30) {
            ctx.beginPath();
            ctx.moveTo(bx, p.y);
            ctx.lineTo(bx, p.y + p.h);
            ctx.stroke();
        }
    }

    // ─── Estrelas ──────────────────────────────────────────
    for (let i = 0; i < STARS.length; i++) {
        if (collected[i]) continue;
        const s = STARS[i];
        const pulse = Math.sin(Date.now() / 250 + i * 1.5) * 2;

        // Brilho
        ctx.shadowColor = 'rgba(255, 215, 0, 0.6)';
        ctx.shadowBlur = 15;

        // Estrela
        ctx.fillStyle = '#FFD700';
        const cx = s.x, cy = s.y + pulse;
        drawStar(ctx, cx, cy, 5, 10, 4);
        ctx.shadowBlur = 0;

        // "?" dentro
        ctx.fillStyle = '#8B6914';
        ctx.font = 'bold 9px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy + 1);
        ctx.textBaseline = 'alphabetic';
    }

    // ─── Jogador (Mario pixel style) ───────────────────────
    const px = Math.round(player.x), py = Math.round(player.y);
    const d = player.dir;

    // Sombra
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 8;

    // Boné (chapéu)
    ctx.fillStyle = '#E03030';
    ctx.fillRect(px + 3, py + 1, 14, 5);
    ctx.fillRect(px + 1, py + 4, 18, 3);

    // Rosto
    ctx.fillStyle = '#F5D0A9';
    ctx.fillRect(px + 2, py + 7, 16, 10);
    ctx.fillRect(px + 4, py + 6, 12, 2);

    // Olhos
    ctx.fillStyle = '#000';
    const eyeX = d > 0 ? px + 12 : px + 6;
    ctx.fillRect(eyeX, py + 8, 2, 3);
    ctx.fillRect(eyeX + 5, py + 8, 2, 3);

    // Sorriso
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 8, py + 14, 6, 2);
    ctx.fillRect(px + 9, py + 13, 4, 1);

    // Bigode
    ctx.fillStyle = '#4A2800';
    ctx.fillRect(px + 6, py + 12, 10, 2);

    // Camisa (vermelha)
    ctx.fillStyle = '#E03030';
    ctx.fillRect(px + 4, py + 17, 14, 10);

    // Braços
    ctx.fillStyle = '#F5D0A9';
    if (Math.abs(player.vx) > 0 && player.grounded) {
        const swing = Math.sin(Date.now() / 120) * 2;
        ctx.fillRect(px + 1, py + 18 + swing, 4, 7);
        ctx.fillRect(px + 17, py + 18 - swing, 4, 7);
    } else {
        ctx.fillRect(px + 1, py + 18, 4, 7);
        ctx.fillRect(px + 17, py + 18, 4, 7);
    }

    // Macacão (azul)
    ctx.fillStyle = '#3060C0';
    ctx.fillRect(px + 5, py + 22, 12, 8);

    // Botões
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(px + 8, py + 20, 2, 2);
    ctx.fillRect(px + 12, py + 20, 2, 2);

    // Pernas
    ctx.fillStyle = '#3060C0';
    if (Math.abs(player.vx) > 0 && player.grounded) {
        const leg = Math.sin(Date.now() / 100) * 3;
        ctx.fillRect(px + 5, py + 28, 6, 7 + leg);
        ctx.fillRect(px + 12, py + 28, 6, 7 - leg);
    } else {
        ctx.fillRect(px + 5, py + 28, 6, 7);
        ctx.fillRect(px + 12, py + 28, 6, 7);
    }

    // Sapatos
    ctx.fillStyle = '#5C3A1E';
    ctx.fillRect(px + 4, py + 33, 8, 4);
    ctx.fillRect(px + 12, py + 33, 8, 4);

    ctx.shadowBlur = 0;

    // ─── Dica no topo ──────────────────────────────────────
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    if (starsCollected < STARS.length) {
        ctx.fillText('Colete as ⭐ para conhecer a Ever!', 360, 16);
    }
    ctx.textAlign = 'start';
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
    }
    ctx.closePath();
    ctx.fill();
}

// ─── LOOP ──────────────────────────────────────────────────
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
