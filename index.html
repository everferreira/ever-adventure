<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Ever's Adventure — Conheça a Ever!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .game-wrapper {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(130, 87, 229, 0.3);
            border: 1px solid rgba(130, 87, 229, 0.2);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: #1a1a2e;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .hud-left { display: flex; gap: 24px; }
        .hud-right { display: flex; gap: 12px; }
        .hud .label { color: #888; }
        .hud .value { color: #8257E5; font-weight: bold; }
        .btn {
            background: #8257E5;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { background: #6b3fcf; transform: scale(1.05); }
        .controls-hint {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 8px 0 4px;
            letter-spacing: 0.5px;
        }
        .controls-hint kbd {
            background: rgba(130, 87, 229, 0.15);
            color: #8257E5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid rgba(130, 87, 229, 0.3);
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="hud">
        <div class="hud-left">
            <span><span class="label">⭐</span> <span class="value" id="scoreDisplay">0</span></span>
            <span><span class="label">Nível</span> <span class="value" id="levelDisplay">1</span></span>
        </div>
        <div class="hud-right">
            <button class="btn" id="restartBtn">↻ Reiniciar</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="720" height="400"></canvas>
    <div class="controls-hint">
        <kbd>←</kbd> <kbd>→</kbd> mover · <kbd>Space</kbd> pular · <kbd>R</kbd> reiniciar
    </div>
</div>

<script>
// ─── CANVAS ────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('scoreDisplay');
const levelSpan = document.getElementById('levelDisplay');

// ─── ESTRELAS — fatos sobre a Ever ─────────────────────────
const LEVEL_DATA = [
    { // Level 1 — Quem é Ever?
        name: "Quem é Ever?",
        stars: [
            { x: 200, y: 200, fact: "✨ Ever Maria Tobias Ferreira", collected: false },
            { x: 400, y: 150, fact: "👩‍🏫 Instrutora Sênior na Ctrl+Play", collected: false },
            { x: 550, y: 250, fact: "🤖 Especialista em IA & Cloud", collected: false },
        ],
        completeMessage: "Missão 1 completa! Conheceu a Ever!"
    },
    { // Level 2 — Skills e experiência
        name: "Skills & Experiência",
        stars: [
            { x: 150, y: 280, fact: "🐍 Python · C/C++ · APIs (Flask/FastAPI)", collected: false },
            { x: 350, y: 180, fact: "☁️ AWS · Azure · IA Generativa", collected: false },
            { x: 500, y: 120, fact: "🎮 Scratch · Arduino · Construct · Unity", collected: false },
            { x: 600, y: 280, fact: "🐧 Linux · Docker · Git · IaC", collected: false },
        ],
        completeMessage: "Missão 2 completa! Conheceu as skills!"
    },
    { // Level 3 — Filosofia e contato
        name: "Filosofia & Contato",
        stars: [
            { x: 180, y: 200, fact: "📚 Formação: UNINTER + ETEC + Google AI", collected: false },
            { x: 380, y: 150, fact: "🏅 Certificada: AWS, IA Generativa, Python", collected: false },
            { x: 520, y: 260, fact: "💡 'A melhor maneira de aprender é ensinando'", collected: false },
            { x: 650, y: 120, fact: "📧 contatoeverferreira@gmail.com", collected: false },
        ],
        completeMessage: "🎉 Você conheceu a Ever! Obrigado por jogar!"
    }
];

let currentLevel = 0;
let score = 0;
let gameState = 'playing'; // 'playing' | 'message'
let messageText = '';
let messageTimer = 0;
let levelComplete = false;

// ─── JOGADOR ────────────────────────────────────────────────
const player = {
    x: 80, y: 300, w: 24, h: 32,
    vx: 0, vy: 0,
    speed: 4,
    jumpPower: -8,
    gravity: 0.45,
    grounded: false,
    facing: 1,
    animFrame: 0,
    animTimer: 0,
};

// ─── PLATAFORMAS ───────────────────────────────────────────
const platforms = [
    // Chão
    { x: 0, y: 380, w: 720, h: 20 },
    // Plataformas fixas
    { x: 100, y: 320, w: 100, h: 12 },
    { x: 280, y: 270, w: 100, h: 12 },
    { x: 460, y: 220, w: 100, h: 12 },
    { x: 620, y: 300, w: 80, h: 12 },
    { x: 50, y: 200, w: 80, h: 12 },
    { x: 300, y: 150, w: 120, h: 12 },
    { x: 550, y: 160, w: 80, h: 12 },
];

// ─── CORES TEMÁTICAS ───────────────────────────────────────
const COLORS = {
    player: '#8257E5',
    playerDark: '#6b3fcf',
    playerLight: '#a07df0',
    platform: 'rgba(130, 87, 229, 0.4)',
    platformBorder: 'rgba(130, 87, 229, 0.6)',
    star: '#FFD700',
    starGlow: 'rgba(255, 215, 0, 0.4)',
    starCollected: 'rgba(255, 215, 0, 0.1)',
    bg: '#1a1a2e',
    text: '#e0e0e0',
};

// ─── ENTRADA ───────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyR') restartGame();
});
document.addEventListener('keyup', e => {
    keys[e.code] = false;
});
document.getElementById('restartBtn').addEventListener('click', restartGame);

// ─── FUNÇÕES ───────────────────────────────────────────────
function getLevel() { return LEVEL_DATA[currentLevel]; }

function restartGame() {
    currentLevel = 0;
    score = 0;
    gameState = 'playing';
    levelComplete = false;
    // Reset stars
    LEVEL_DATA.forEach(l => l.stars.forEach(s => s.collected = false));
    resetPlayer();
    updateHUD();
}

function resetPlayer() {
    player.x = 80;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.h > rect2.y;
}

function rectForPlayer() {
    return { x: player.x, y: player.y, w: player.w, h: player.h };
}

function showMessage(text, duration = 150) {
    gameState = 'message';
    messageText = text;
    messageTimer = duration;
}

// ─── UPDATE ────────────────────────────────────────────────
function update() {
    if (gameState === 'message') {
        messageTimer--;
        if (messageTimer <= 0) {
            gameState = 'playing';
            if (levelComplete) {
                levelComplete = false;
                currentLevel++;
                if (currentLevel >= LEVEL_DATA.length) {
                    showMessage("🎉 Parabéns! Você completou o jogo! 🎉", 300);
                    currentLevel = LEVEL_DATA.length - 1;
                } else {
                    resetPlayer();
                    updateHUD();
                }
            }
        }
        return;
    }

    // Input
    player.vx = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -player.speed; player.facing = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { player.vx = player.speed; player.facing = 1; }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    // Gravidade
    player.vy += player.gravity;

    // Limite de velocidade
    if (player.vy > 12) player.vy = 12;

    // Movimento X
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    // Movimento Y
    player.y += player.vy;

    // Colisão com plataformas (apenas de cima)
    player.grounded = false;
    const pRect = rectForPlayer();
    for (const plat of platforms) {
        if (checkCollision(pRect, plat)) {
            // De cima
            if (player.vy > 0 && player.y + player.h - player.vy <= plat.y + 4) {
                player.y = plat.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
            // De baixo
            else if (player.vy < 0 && player.y - player.vy >= plat.y + plat.h - 4) {
                player.y = plat.y + plat.h;
                player.vy = 0;
            }
        }
    }

    // Cair fora da tela
    if (player.y > canvas.height + 50) {
        resetPlayer();
    }

    // Colisão com estrelas
    const level = getLevel();
    for (const star of level.stars) {
        if (star.collected) continue;
        const dx = (player.x + player.w/2) - star.x;
        const dy = (player.y + player.h/2) - star.y;
        if (Math.sqrt(dx*dx + dy*dy) < 24) {
            star.collected = true;
            score += 10;
            showMessage(star.fact, 120);
            updateHUD();
        }
    }

    // Verificar se todas as estrelas do nível foram coletadas
    const allCollected = level.stars.every(s => s.collected);
    if (allCollected && gameState === 'playing') {
        levelComplete = true;
        if (currentLevel < LEVEL_DATA.length - 1) {
            showMessage("✅ " + level.completeMessage + " — Pressione ESPAÇO para continuar", 200);
        } else {
            showMessage("🎉 " + level.completeMessage + " 🎉", 500);
        }
    }

    // Animação
    if (Math.abs(player.vx) > 0 && player.grounded) {
        player.animTimer++;
        if (player.animTimer > 8) {
            player.animFrame = (player.animFrame + 1) % 4;
            player.animTimer = 0;
        }
    } else if (player.grounded) {
        player.animFrame = 0;
        player.animTimer = 0;
    }
}

// ─── DRAW ──────────────────────────────────────────────────
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundo com gradiente
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#0f0c29');
    bgGrad.addColorStop(0.5, '#302b63');
    bgGrad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Estrelas de fundo decorativas
    for (let i = 0; i < 40; i++) {
        const sx = (i * 137.5 + 50) % canvas.width;
        const sy = (i * 89.3 + 20) % (canvas.height - 60);
        const brightness = 0.3 + (i % 5) * 0.15;
        ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }

    // Nível atual — nome
    ctx.fillStyle = 'rgba(130, 87, 229, 0.5)';
    ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`★ ${getLevel().name} ★`, canvas.width / 2, 28);

    // Plataformas
    for (const plat of platforms) {
        const grad = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.h);
        grad.addColorStop(0, 'rgba(130, 87, 229, 0.6)');
        grad.addColorStop(1, 'rgba(130, 87, 229, 0.3)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(130, 87, 229, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Estrelas (coletáveis)
    const level = getLevel();
    for (const star of level.stars) {
        if (star.collected) continue;
        const pulse = Math.sin(Date.now() / 300 + star.x) * 2;

        // Brilho
        ctx.shadowColor = COLORS.starGlow;
        ctx.shadowBlur = 15;

        ctx.fillStyle = COLORS.star;
        const cx = star.x, cy = star.y + pulse;
        const size = 10;
        drawStar(ctx, cx, cy, 5, size, size * 0.4);

        ctx.shadowBlur = 0;

        // Rótulo
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '10px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('?', cx, cy + 4);
    }

    // Jogador (pixel art personagem)
    const px = Math.round(player.x), py = Math.round(player.y);
    const dir = player.facing;

    // Brilho no chão
    ctx.shadowColor = 'rgba(130, 87, 229, 0.3)';
    ctx.shadowBlur = 20;

    // Corpo (blusa)
    ctx.fillStyle = COLORS.player;
    ctx.beginPath();
    ctx.roundRect(px + 2, py + 10, player.w - 4, 14, 4);
    ctx.fill();

    // Cabeça
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + 7, 9, 0, Math.PI * 2);
    ctx.fill();

    // Cabelo
    ctx.fillStyle = '#2d1b00';
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + 5, 10, Math.PI, 2 * Math.PI);
    ctx.fill();

    // Olhos
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px + 8, py + 5, 3, 3);
    ctx.fillRect(px + 14, py + 5, 3, 3);

    // Sorriso
    ctx.strokeStyle = '#2d1b00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + 8, 4, 0.1, Math.PI - 0.1);
    ctx.stroke();

    // Braços (animação)
    ctx.fillStyle = '#e8c39e';
    const armDir = player.grounded && Math.abs(player.vx) > 0 ? Math.sin(Date.now() / 150) * 3 : 0;
    ctx.fillRect(px - 2, py + 12 + armDir, 5, 8);
    ctx.fillRect(px + player.w - 3, py + 12 - armDir, 5, 8);

    // Pernas
    ctx.fillStyle = '#2d1b00';
    const legAnim = player.grounded && Math.abs(player.vx) > 0 ? Math.sin(Date.now() / 100) * 3 : 0;
    ctx.fillRect(px + 4, py + 24, 6, 8 + legAnim);
    ctx.fillRect(px + 14, py + 24, 6, 8 - legAnim);

    ctx.shadowBlur = 0;

    // Mensagem na tela
    if (gameState === 'message' && messageText) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.beginPath();
        ctx.roundRect(canvas.width/2 - 250, 180, 500, 60, 12);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(messageText, canvas.width/2, 210);
        ctx.textBaseline = 'alphabetic';
    }

    // Dica de continuar (quando level completo)
    if (levelComplete && gameState === 'playing') {
        ctx.fillStyle = 'rgba(130, 87, 229, 0.8)';
        ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Pressione ESPAÇO para continuar ➜', canvas.width/2, canvas.height - 20);
    }
}

// ─── STAR DRAWING HELPER ──────────────────────────────────
function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI / 2 * 3;
    let step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fill();
}

function updateHUD() {
    scoreSpan.textContent = score;
    levelSpan.textContent = `${currentLevel + 1}/${LEVEL_DATA.length}`;
}

// ─── GAME LOOP ─────────────────────────────────────────────
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
updateHUD();
</script>
</body>
</html>
